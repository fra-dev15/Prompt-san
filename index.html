<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pickstyle</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎲</text></svg>">
<style>
  body {
    font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
    background-color: #f4f7f6;
    color: #333;
    text-align: center;
    padding: 40px 20px;
  }
  .container {
    background: #ffffff;
    max-width: 500px;
    margin: 0 auto;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.1);
  }
  h2 {
    margin-top: 0;
    color: #2c3e50;
  }
  .desc {
    color: #7f8c8d;
    font-size: 14px;
    margin-bottom: 20px;
  }
  .input-group {
    margin: 20px 0;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
  }
  .input-group label {
    font-weight: bold;
    color: #2c3e50;
    font-size: 16px;
  }
  .input-group input[type="number"] {
    width: 60px;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 16px;
    text-align: center;
  }
  button {
    background-color: #3498db;
    color: #fff;
    border: none;
    padding: 12px 24px;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.3s;
    font-weight: bold;
  }
  button:hover {
    background-color: #2980b9;
  }
  button:disabled {
    background-color: #bdc3c7;
    cursor: not-allowed;
  }
  .result-container {
    margin-top: 25px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .result-box {
    background: #e8f4f8;
    color: #2c3e50;
    padding: 15px 20px;
    border-radius: 8px;
    font-size: 22px;
    font-weight: bold;
    border: 2px solid #3498db;
    word-break: break-all;
    width: 90%;
    box-sizing: border-box;
  }
  .copy-btn {
    background-color: #2ecc71;
    font-size: 14px;
    padding: 8px 18px;
  }
  .copy-btn:hover {
    background-color: #27ae60;
  }
  .error-msg {
    color: #e74c3c;
    font-size: 14px;
    margin-top: 10px;
  }
  .toast {
    font-size: 13px;
    color: #27ae60;
    font-weight: bold;
    height: 18px;
  }
</style>
</head>
<body>

  <div class="container">
    <h2>pickstyle</h2>
    <p class="desc">データベースから指定した数の要素をランダムに抽出します</p>
    
    <!-- 抽出数の入力欄 -->
    <div class="input-group">
      <label for="extractCount">抽出する数 (1〜10): </label>
      <input type="number" id="extractCount" min="1" max="10" value="2">
    </div>

    <button id="extractBtn">ランダムに抽出</button>
    
    <div id="errorArea" class="error-msg"></div>

    <!-- 結果表示＆コピーエリア -->
    <div id="resultArea" class="result-container" style="display: none;">
      <div id="resultText" class="result-box"></div>
      <button id="copyBtn" class="copy-btn">クリップボードにコピー</button>
      <div id="toast" class="toast"></div>
    </div>
  </div>

  <script>
    const API_URL = 'https://pick-style.vercel.app/api/pickstyle';

    let currentResult = "";

    const extractBtn = document.getElementById('extractBtn');
    const extractCountInput = document.getElementById('extractCount');
    const resultArea = document.getElementById('resultArea');
    const resultText = document.getElementById('resultText');
    const copyBtn = document.getElementById('copyBtn');
    const toast = document.getElementById('toast');
    const errorArea = document.getElementById('errorArea');

    // 入力値の制限 (1〜10) を制御
    extractCountInput.addEventListener('input', function() {
      let val = parseInt(this.value, 10);
      if (val > 10) this.value = 10;
      if (val < 1) this.value = 1;
    });

    // 抽出ボタンクリック処理（API連携）
    extractBtn.addEventListener('click', async function() {
      let count = parseInt(extractCountInput.value, 10);
      
      if (isNaN(count) || count < 1) count = 1;
      if (count > 10) count = 10;

      // UIの初期化
      errorArea.textContent = '';
      extractBtn.disabled = true;
      extractBtn.textContent = '抽出中...';

      try {
        // Vercel APIへリクエストを送信
        const response = await fetch(`${API_URL}?count=${count}`);
        
        if (!response.ok) {
          throw new Error('APIからのデータ取得に失敗しました');
        }

        const result = await response.json();

        if (result.success && Array.isArray(result.data)) {
          // ① 取得した要素をカンマ区切りで結合
          currentResult = result.data.join(',');

          // 画面に表示
          resultText.textContent = currentResult;
          resultArea.style.display = 'flex';
          toast.textContent = '';
          copyBtn.textContent = 'クリップボードにコピー';
        } else {
          throw new Error(result.error || 'データの抽出に失敗しました');
        }
      } catch (err) {
        console.error(err);
        errorArea.textContent = `エラー: ${err.message}`;
        resultArea.style.display = 'none';
      } finally {
        extractBtn.disabled = false;
        extractBtn.textContent = 'ランダムに抽出';
      }
    });

    // ② コピーボタンクリック処理
    copyBtn.addEventListener('click', function() {
      if (!currentResult) return;

      function doCopy() {
        if (navigator.clipboard && window.isSecureContext) {
          return navigator.clipboard.writeText(currentResult);
        } else {
          const tempArea = document.createElement('textarea');
          tempArea.value = currentResult;
          document.body.appendChild(tempArea);
          tempArea.select();
          document.execCommand('copy');
          document.body.removeChild(tempArea);
          return Promise.resolve();
        }
      }

      doCopy().then(() => {
        copyBtn.textContent = 'コピー完了！';
        toast.textContent = '✓ クリップボードにコピーしました';
        setTimeout(() => {
          copyBtn.textContent = 'クリップボードにコピー';
          toast.textContent = '';
        }, 2000);
      });
    });
  </script>

</body>
</html>
