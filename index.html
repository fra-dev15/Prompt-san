<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt-san</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 font-size=%2280%22>🎲</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ハンバーガーボタン、サイドバー、オーバーレイ -->
  <button class="hamburger-btn" id="hamburgerBtn" aria-label="メニューを開く">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>Prompt-san</h2>
      <button class="close-btn" id="closeBtn">&times;</button>
    </div>
    <ul class="menu-list">
      <li><a href="#" class="menu-item active" data-target="generator-section">📝 PickStyle</a></li>
      <li><a href="#" class="menu-item" data-target="database-section">🗄️ データ一覧</a></li>
      <li><a href="#" class="menu-item" data-target="history-section">📜 履歴</a></li>
      <li><a href="#" class="menu-item" data-target="templates-section">📚 テンプレート</a></li>
      <li><a href="#" class="menu-item" data-target="settings-section">⚙️ 設定</a></li>
    </ul>
  </nav>

  <div class="overlay" id="overlay"></div>

  <!-- メインコンテンツ -->
  <main class="main-content">
    
    <!-- PickStyle -->
    <section id="generator-section" class="content-section">
      <div class="container">
        <h2>pickstyle</h2>
        <p class="desc">データベースから指定した数の要素をランダムに抽出します</p>
        
        <!-- 抽出数の入力欄 -->
        <div class="input-group">
            <label for="countSelect">抽出する数：</label>
            <select id="countInput">
              <option value="1">1</option>
              <option value="2" selected>2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
            </select>
        </div>

        <button id="extractBtn">ランダムに抽出</button>
        
        <div id="errorArea" class="error-msg"></div>

        <!-- 結果表示＆コピーエリア -->
        <div id="resultArea" class="result-container" style="display: none;">
          <div id="resultText" class="result-box"></div>
          <button id="copyBtn" class="copy-btn">クリップボードにコピー</button>
          <div id="toast" class="toast"></div>
        </div>
      </div>
    </section>
    
    <section id="database-section" class="content-section" hidden>
      <h2>データ一覧</h2>
      <p>現在登録されているデータの一覧です。</p>
      
      <div class="table-container">
        <table id="dataTable">
          <thead>
            <tr>
              <th>正式名称</th>
              <th>プロンプト</th>
            </tr>
          </thead>
          <tbody id="dataTableBody">
            <!-- ここにJSでデータを流し込む -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- ★今後追加する新機能用のセクション（初期状態は hidden）★ -->
    <section id="history-section" class="content-section" hidden>
      <h2>履歴</h2>
      <p>ここに過去のプロンプトを表示します。</p>
    </section>

    <section id="templates-section" class="content-section" hidden>
      <h2>テンプレート</h2>
      <p>ここにテンプレート一覧を表示します。</p>
    </section>

    <section id="settings-section" class="content-section" hidden>
      <h2>設定</h2>
      <p>ここに設定項目を表示します。</p>
    </section>

  </main>

  <!-- JSファイルの読み込み -->
  <script src="js/menu.js" defer></script>
  <script src="js/picker.js" defer></script>
  <script type="module" src="js/list.js"></script>

</body>
</html>
