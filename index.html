<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pickstyle</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎲</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background-color: #f4f7f6;
      color: #333;
      text-align: center;
      padding: 40px 20px;
    }
    .container {
      background: #ffffff;
      max-width: 500px;
      margin: 0 auto;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
    }
    h2 {
      margin-top: 0;
      color: #2c3e50;
    }
    .desc {
      color: #7f8c8d;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .input-group {
      margin: 20px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    .input-group label {
      font-weight: bold;
      color: #2c3e50;
      font-size: 16px;
    }
    .input-group input[type="number"] {
      width: 60px;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
      text-align: center;
    }
    button {
      background-color: #3498db;
      color: #fff;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s;
      font-weight: bold;
    }
    button:hover {
      background-color: #2980b9;
    }
    button:disabled {
      background-color: #bdc3c7;
      cursor: not-allowed;
    }
    .result-container {
      margin-top: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .result-box {
      background: #e8f4f8;
      color: #2c3e50;
      padding: 15px 20px;
      border-radius: 8px;
      font-size: 22px;
      font-weight: bold;
      border: 2px solid #3498db;
      word-break: break-all;
      width: 90%;
      box-sizing: border-box;
    }
    .copy-btn {
      background-color: #2ecc71;
      font-size: 14px;
      padding: 8px 18px;
    }
    .copy-btn:hover {
      background-color: #27ae60;
    }
    .error-msg {
      color: #e74c3c;
      font-size: 14px;
      margin-top: 10px;
    }
    .toast {
      font-size: 13px;
      color: #27ae60;
      font-weight: bold;
      height: 18px;
    }
  </style>
</head>
<body>

  <!-- ハンバーガーボタン、サイドバー、オーバーレイ -->
  <button class="hamburger-btn" id="hamburgerBtn" aria-label="メニューを開く">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>Prompt-san</h2>
      <button class="close-btn" id="closeBtn">&times;</button>
    </div>
    <ul class="menu-list">
      <li><a href="#" class="menu-item active" data-target="generator-section">📝 プロンプト作成</a></li>
      <li><a href="#" class="menu-item" data-target="database-section">🗄️ データ一覧</a></li>
      <li><a href="#" class="menu-item" data-target="history-section">📜 履歴</a></li>
      <li><a href="#" class="menu-item" data-target="templates-section">📚 テンプレート</a></li>
      <li><a href="#" class="menu-item" data-target="settings-section">⚙️ 設定</a></li>
    </ul>
  </nav>

  <div class="overlay" id="overlay"></div>

  <!-- メインコンテンツ -->
  <main class="main-content">
    
    <!-- ★現在動いているメイン画面★ -->
    <section id="generator-section" class="content-section">
      <div class="container">
        <h2>pickstyle</h2>
        <p class="desc">データベースから指定した数の要素をランダムに抽出します</p>
        
        <!-- 抽出数の入力欄 -->
        <div class="input-group">
          <label for="extractCount">抽出する数 (1〜10): </label>
          <input type="number" id="extractCount" min="1" max="10" value="2">
        </div>

        <button id="extractBtn">ランダムに抽出</button>
        
        <div id="errorArea" class="error-msg"></div>

        <!-- 結果表示＆コピーエリア -->
        <div id="resultArea" class="result-container" style="display: none;">
          <div id="resultText" class="result-box"></div>
          <button id="copyBtn" class="copy-btn">クリップボードにコピー</button>
          <div id="toast" class="toast"></div>
        </div>
      </div>
    </section>
    
    <section id="database-section" class="content-section" hidden>
      <h2>データ一覧</h2>
      <p>現在登録されているデータの一覧です。</p>
      
      <div class="table-container">
        <table id="dataTable">
          <thead>
            <tr>
              <th>正式名称</th>
              <th>プロンプト</th>
            </tr>
          </thead>
          <tbody id="dataTableBody">
            <!-- ここにJSでデータを流し込む -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- ★今後追加する新機能用のセクション（初期状態は hidden）★ -->
    <section id="history-section" class="content-section" hidden>
      <h2>履歴</h2>
      <p>ここに過去のプロンプトを表示します。</p>
    </section>

    <section id="templates-section" class="content-section" hidden>
      <h2>テンプレート</h2>
      <p>ここにテンプレート一覧を表示します。</p>
    </section>

    <section id="settings-section" class="content-section" hidden>
      <h2>設定</h2>
      <p>ここに設定項目を表示します。</p>
    </section>

  </main>

  <!-- JSファイルの読み込み -->
  <script src="js/menu.js" defer></script>
  <script src="js/picker.js" defer></script>
  <script src="js/list.js" defer></script>

</body>
</html>
